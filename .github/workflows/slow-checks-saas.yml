name: Slow-Checks-SaaS

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  approve-run-slow-tests-saas:
    name: Approve Running Slow Tests for SaaS?
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    environment: manual-approval
    steps:
      - name: Tests
        run: echo "Slow tests for SaaS approved"

  build-matrix:
    name: Build Matrix
    uses: $/.github/workflows/matrix.yml
    needs:
      - approve-run-slow-tests-saas
    permissions:
      contents: read
    with:
      matrix_keys_json: '["minimum_python_version"]'

  run-integration-tests:
    name: Run Integration Tests with SaaS (Python-${{ matrix.minimum_python_version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
     - build-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python & Poetry Environment
        id: set-up-python-and-poetry-environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: ${{ matrix.minimum_python_version }}
          poetry-version: "2.3.0"

      - name: Run Integration Tests
        id: run-integration-tests
        env:
          SAAS_HOST: ${{ secrets.INTEGRATION_TEAM_SAAS_STAGING_HOST }}
          SAAS_ACCOUNT_ID: ${{ secrets.INTEGRATION_TEAM_SAAS_STAGING_ACCOUNT_ID }}
          SAAS_PAT: ${{ secrets.INTEGRATION_TEAM_SAAS_STAGING_PAT }}
        run: poetry run -- nox -s test:integration -- -s --coverage --backend=saas

      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python${{ matrix.minimum_python_version }}-slow-saas
          path: .coverage
          include-hidden-files: true
          overwrite: false
